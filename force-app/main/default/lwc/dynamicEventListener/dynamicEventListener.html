<template>
    <lightning-card title="lwc:on Directive Demo">
        <!-- Mode Toggle -->
        <div class="slds-var-p-around_medium">
            <lightning-button-group>
                <lightning-button 
                    label="Click Mode" 
                    onclick={setClickMode}
                    variant={clickVariant}>
                </lightning-button>
                <lightning-button 
                    label="Hover Mode" 
                    onclick={setHoverMode}
                    variant={hoverVariant}>
                </lightning-button>
            </lightning-button-group>
        </div>

        <!-- 🔥 THE MAGIC: lwc:on dynamically attaches event handlers -->
        <div class="slds-p-around_medium">
            <div class="interactive-box" lwc:on={boxEventHandlers}>
                {message}
            </div>
        </div>

        <div class="slds-p-around_medium slds-text-color_weak">
            Current mode: <strong>{eventMode}</strong>
        </div>
    </lightning-card>
</template>
